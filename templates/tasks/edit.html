{% extends "base.html" %}

{% block title %}
Edit Task - TaskFlow
{% endblock %}

{% block content %}

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/edit-task.css') }}"
>

<div class="edit-task-container">

    <h2>Edit Task</h2>

    <form method="POST" class="edit-task-form">
        <input type="hidden" name="csrf_token" value="{{csrf_token()}}">

        <label>Task Title</label>

        <input
            type="text"
            name="title"
            value="{{ task.title }}"
            required
        >


        <label>Description</label>

        <textarea
            name="description"
            rows="5"
        >{{ task.description }}</textarea>


        <label>Status</label>

        <select name="status">

            <option value="pending"
                {% if task.status == "pending" %}selected{% endif %}>
                Pending
            </option>

            <option value="in_progress"
                {% if task.status == "in_progress" %}selected{% endif %}>
                In Progress
            </option>

            <option value="completed"
                {% if task.status == "completed" %}selected{% endif %}>
                Completed
            </option>

        </select>


        <label>Priority</label>

        <select name="priority">

            <option value="low"
                {% if task.priority == "low" %}selected{% endif %}>
                Low
            </option>

            <option value="medium"
                {% if task.priority == "medium" %}selected{% endif %}>
                Medium
            </option>

            <option value="high"
                {% if task.priority == "high" %}selected{% endif %}>
                High
            </option>

        </select>


        <label>Due Date</label>

        <input
            type="date"
            name="due_date"
            value="{{ due_date if due_date is defined else task.due_date }}"
        >


        <button type="submit">
            Update Task
        </button>

    </form>

</div>

{% endblock %}
