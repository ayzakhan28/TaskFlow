{% extends "base.html" %}

{% block title %}
404 - Page Not Found
{% endblock %}

{% block head %}

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/error.css') }}"
>

{% endblock %}


{% block content %}

<div class="error-page">

    <div class="error-card">

        <div class="error-number">
            404
        </div>

        <h1>
            Page Not Found
        </h1>

        <p>
            Oops! The page you're looking for doesn't exist.
        </p>

        <a
            href="{{ url_for('home') }}"
            class="back-home-btn"
        >
            ← Back to Home
        </a>

    </div>

</div>

{% endblock %}
