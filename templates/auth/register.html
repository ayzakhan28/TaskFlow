{% extends "base.html" %}

{% block title %}
Create Account - TaskFlow
{% endblock %}

{% block head %}
<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/auth.css') }}"
>
{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <div class="auth-icon">
                ✦
            </div>

            <h1>Create Account</h1>

            <p>
                Join TaskFlow and start managing your tasks
                more efficiently.
            </p>

        </div>


        <form method="POST" class="auth-form">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-submit"
            >
                Create Account →
            </button>

        </form>


        <div class="auth-footer">

            <p>
                Already have an account?
                <a href="{{ url_for('auth.login') }}">
                    Login here
                </a>
            </p>

        </div>

    </div>

</section>

{% endblock %}
