{% extends "base.html" %}

{% block title %}
Login - TaskFlow
{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{url_for('static', filename='css/auth.css')}}">
{% endblock%}
{% block content %}





<div class="login-page">


    <div class="login-card">


        <!-- Header -->

        <div class="login-header">

            <div class="login-icon">
                🔐
            </div>

            <h1>
                Welcome Back
            </h1>

            <p>
                Login to your TaskFlow account
            </p>

        </div>



        <!-- Login Form -->

        <form method="POST">

            <input type="hidden" name="csrf_token" value="{{csrf_token()}}">


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>



            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>



            <!-- Submit -->

            <button
                type="submit"
                class="login-submit"
            >
                Login
            </button>


        </form>



        <!-- Register -->

        <p class="register-text">

            Don't have an account?

            <a href="{{ url_for('auth.register') }}">
                Create an account
            </a>

        </p>


    </div>

</div>


{% endblock %}
