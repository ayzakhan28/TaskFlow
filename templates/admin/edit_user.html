{% extends "base.html" %}

{% block title %}
Edit User - TaskFlow
{% endblock %}

{% block head %}
<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/admin.css') }}"
>
{% endblock %}

{% block content %}

<section class="edit-user-page">

    <div class="edit-user-card">

        <div class="edit-user-header">

            <div class="edit-user-icon">
                ✎
            </div>

            <h1>Edit User</h1>

            <p>
                Update the user's account information and role.
            </p>

        </div>


        <form method="POST" class="edit-user-form">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >


            <div class="admin-form-group">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ user.name }}"
                    required
                >

            </div>


            <div class="admin-form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ user.email }}"
                    required
                >

            </div>


            <div class="admin-form-group">

                <label for="role">
                    Account Role
                </label>

                <select
                    id="role"
                    name="role"
                    required
                >

                    <option
                        value="user"
                        {% if user.role == "user" %}
                            selected
                        {% endif %}
                    >
                        User
                    </option>

                    <option
                        value="admin"
                        {% if user.role == "admin" %}
                            selected
                        {% endif %}
                    >
                        Admin
                    </option>

                </select>

            </div>


            <div class="edit-user-actions">

                <a
                    href="{{ url_for('admin.dashboard') }}"
                    class="cancel-btn"
                >
                    ← Cancel
                </a>

                <button
                    type="submit"
                    class="update-user-btn"
                >
                    Update User
                </button>

            </div>

        </form>

    </div>

</section>

{% endblock %}
